<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<title>绿意 · 静心 — 轻音乐与植物</title>
<style>
  :root{
    --bg:#f6f5f1;
    --bg-soft:#eef2ea;
    --card:#ffffff;
    --ink:#2f3e34;
    --ink-soft:#6b776f;
    --green:#6f9a73;
    --green-deep:#4c7352;
    --green-tint:#e3ece0;
    --terra:#c98e5e;
    --line:#e7e5df;
    --shadow:0 10px 30px rgba(60,80,60,.08);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 80% -10%, #eef3ea 0%, transparent 60%),
      radial-gradient(900px 500px at -10% 30%, #f3efe6 0%, transparent 55%),
      var(--bg);
    min-height:100vh;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 20px}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    backdrop-filter:saturate(140%) blur(12px);
    background:rgba(246,245,241,.78);
    border-bottom:1px solid var(--line);
  }
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:.5px}
  .brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--green),#9bbf97);display:grid;place-items:center;font-size:13px;color:#fff}
  .controls{display:flex;align-items:center;gap:12px}
  .play-btn{
    width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
    background:var(--green);color:#fff;display:grid;place-items:center;
    box-shadow:0 4px 14px rgba(111,154,115,.35);
    transition:transform .15s ease, background .2s ease;
  }
  .play-btn:hover{transform:scale(1.06)}
  .play-btn:active{transform:scale(.95)}
  .play-btn svg{width:18px;height:18px;fill:currentColor}
  .vol{display:flex;align-items:center;gap:8px}
  .vol svg{width:16px;height:16px;fill:var(--ink-soft);flex:none}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:84px;height:4px;border-radius:4px;
    background:var(--green-tint);outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--green);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2);
  }
  input[type=range]::-moz-range-thumb{
    width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid #fff;
  }

  /* ---------- Hero ---------- */
  .hero{padding:52px 0 26px;text-align:center}
  .hero .eyebrow{display:inline-block;font-size:12px;letter-spacing:3px;color:var(--green-deep);background:var(--green-tint);padding:5px 14px;border-radius:99px;margin-bottom:18px}
  .hero h1{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-weight:600;font-size:clamp(26px,6vw,38px);letter-spacing:2px;color:var(--ink)}
  .hero p{color:var(--ink-soft);margin-top:12px;font-size:15px}

  /* ---------- Now playing ---------- */
  .now{
    margin:6px 0 8px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 22px;
    display:flex;align-items:center;gap:16px;
  }
  .eq{display:flex;align-items:flex-end;gap:3px;height:26px}
  .eq i{width:4px;border-radius:2px;background:var(--green);height:8px;transition:height .3s}
  .eq.on i{animation:eq 1.1s ease-in-out infinite}
  .eq.on i:nth-child(2){animation-delay:.18s}
  .eq.on i:nth-child(3){animation-delay:.36s}
  .eq.on i:nth-child(4){animation-delay:.54s}
  @keyframes eq{0%,100%{height:7px}50%{height:24px}}
  .now .meta{flex:1;min-width:0}
  .now .meta .lbl{font-size:11px;letter-spacing:2px;color:var(--ink-soft)}
  .now .meta .name{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:17px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now .hint{font-size:12px;color:var(--ink-soft);text-align:right}

  /* ---------- Plants ---------- */
  .section-title{margin:38px 0 18px;text-align:center}
  .section-title h2{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-weight:600;font-size:22px;letter-spacing:2px}
  .section-title p{color:var(--ink-soft);font-size:13px;margin-top:4px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(60,80,60,.13)}
  .plant-icon{
    width:56px;height:56px;border-radius:16px;display:grid;place-items:center;
    font-size:28px;background:linear-gradient(135deg,var(--green-tint),#f2f6ef);
  }
  .card h3{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-size:19px;font-weight:600}
  .card .latin{font-size:12px;color:var(--ink-soft);font-style:italic;margin-top:-6px}
  .card .desc{font-size:14px;color:var(--ink);line-height:1.75}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
  .tag{font-size:11px;color:var(--green-deep);background:var(--green-tint);padding:3px 10px;border-radius:99px;letter-spacing:.5px}

  footer{padding:44px 0 60px;text-align:center;color:var(--ink-soft);font-size:12.5px}
  footer .leaf{font-size:16px;display:block;margin-bottom:8px;color:var(--green)}
  footer b{color:var(--ink)}

  /* ---------- Intro overlay ---------- */
  .overlay{
    position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(900px 600px at 50% 20%, #edf3ea, #e7eee2 70%, #dfe9d9);
    padding:24px;transition:opacity .6s ease, visibility .6s;
  }
  .overlay.hide{opacity:0;visibility:hidden;pointer-events:none}
  .overlay .box{text-align:center;max-width:360px}
  .overlay .big{font-size:56px;display:block;margin-bottom:18px;animation:float 3.5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .overlay h2{font-family:"Songti SC","STSong","Noto Serif SC",serif;font-weight:600;font-size:26px;letter-spacing:2px;color:var(--ink)}
  .overlay p{color:var(--ink-soft);margin:12px 0 26px;font-size:14px}
  .overlay button{
    border:none;cursor:pointer;background:var(--green);color:#fff;font-size:16px;letter-spacing:2px;
    padding:14px 42px;border-radius:99px;box-shadow:0 8px 22px rgba(111,154,115,.4);
    transition:transform .15s ease;
  }
  .overlay button:hover{transform:translateY(-2px)}
  .overlay button:active{transform:scale(.97)}

  @media (max-width:520px){
    .grid{grid-template-columns:1fr}
    .vol{display:none}
  }
</style>
</head>
<body>

  <!-- 顶部 -->
  <div class="topbar">
    <div class="wrap">
      <div class="brand"><span class="dot">🌿</span>绿意 · 静心</div>
      <div class="controls">
        <div class="vol">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16.5 12a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
          <input type="range" id="volume" min="0" max="100" value="70" aria-label="音量">
        </div>
        <button class="play-btn" id="playBtn" aria-label="播放/暂停">
          <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 开场遮罩（自动播放需一次点击） -->
  <div class="overlay" id="overlay">
    <div class="box">
      <span class="big">🪴</span>
      <h2>绿意 · 静心</h2>
      <p>轻触下方按钮，<br>让安静的轻音乐与温柔的植物陪你慢下来。</p>
      <button id="startBtn">开始聆听</button>
    </div>
  </div>

  <div class="wrap">
    <!-- 主视觉 -->
    <section class="hero">
      <span class="eyebrow">SLOW DOWN · 静下来</span>
      <h1>让绿意与轻音<br>陪你慢下来</h1>
      <p>一首安静的歌，几株温柔的植物。</p>
    </section>

    <!-- 正在播放 -->
    <section class="now">
      <div class="eq" id="eq"><i></i><i></i><i></i><i></i></div>
      <div class="meta">
        <div class="lbl">正在播放 · 环境音</div>
        <div class="name" id="nowName">—</div>
      </div>
      <div class="hint" id="nowHint">未开始</div>
    </section>

    <!-- 植物介绍 -->
    <div class="section-title">
      <h2>认识这些安静的植物</h2>
      <p>每一株，都有它的温柔与故事</p>
    </div>
    <section class="grid" id="plantGrid"></section>

    <footer>
      <span class="leaf">🍃</span>
      轻触 NFC 卡片，随时回到这片宁静<br>
      <b>愿你在绿意中，找回片刻松弛。</b>
    </footer>
  </div>

<script>
/* =========================================================
   植物数据
========================================================= */
const plants = [
  { emoji:"🪴", name:"绿萝", latin:"Epipremnum aureum",
    desc:"耐阴耐旱，几乎养不死。能吸收甲醛等有害气体，是公认的「空气净化小能手」，水培土培皆可。",
    tags:["散射光","土培/水培","新手友好"] },
  { emoji:"🍃", name:"龟背竹", latin:"Monstera deliciosa",
    desc:"叶片天然开裂，充满热带风情，是北欧家居的颜值担当。喜散射光，忌强光暴晒。",
    tags:["散射光","见干见湿","高颜值"] },
  { emoji:"🌱", name:"多肉植物", latin:"Succulents",
    desc:"胖嘟嘟的叶片自带治愈感，浇水宁少勿多。摆一盆在案头，连心情都会变软。",
    tags:["充足光照","少浇水","治愈系"] },
  { emoji:"🌵", name:"仙人掌", latin:"Cactaceae",
    desc:"耐旱耐晒，生命力顽强。长时间不浇水也能活得很好，是忙碌者的理想伙伴。",
    tags:["充足光照","极耐旱","坚强"] },
  { emoji:"🌸", name:"白掌", latin:"Spathiphyllum",
    desc:"又称「一帆风顺」，白色佛焰苞优雅清新，能净化室内空气，寓意事事顺利。",
    tags:["散射光","喜湿润","寓意美好"] },
  { emoji:"🌿", name:"芦荟", latin:"Aloe vera",
    desc:"既是绿植也是「家庭小药箱」，凝胶可舒缓晒伤。耐旱好养，喜温暖与光照。",
    tags:["充足光照","耐旱","实用"] },
  { emoji:"🌾", name:"吊兰", latin:"Chlorophytum comosum",
    desc:"垂吊的枝条优雅灵动，净化空气能力强，是经典不衰的入门植物。",
    tags:["散射光","喜湿润","经典"] },
  { emoji:"🎍", name:"富贵竹", latin:"Dracaena sanderiana",
    desc:"水培即可生长，寓意「花开富贵、竹报平安」，常摆于书桌与玄关。",
    tags:["散射光","水培","好寓意"] },
];

function renderPlants(){
  const grid = document.getElementById('plantGrid');
  grid.innerHTML = plants.map(p => `
    <article class="card">
      <div class="plant-icon">${p.emoji}</div>
      <h3>${p.name}</h3>
      <div class="latin">${p.latin}</div>
      <p class="desc">${p.desc}</p>
      <div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    </article>
  `).join('');
}
renderPlants();

/* =========================================================
   环境轻音乐（Web Audio 实时合成，无音频文件 / 无版权 / 可离线）
========================================================= */
const $ = s => document.querySelector(s);
const playBtn = $('#playBtn');
const iconPlay = $('#iconPlay');
const iconPause = $('#iconPause');
const eq = $('#eq');
const nowName = $('#nowName');
const nowHint = $('#nowHint');
const overlay = $('#overlay');
const volume = $('#volume');

let ctx = null, master = null, filter = null;
let playing = false;
let userVolume = 0.7;
let nextChordTime = 0, nextArpTime = 0, chordIndex = 0;

// 和弦进行：C → Am → F → G，温暖舒缓
const chords = [
  { name:'C 大调 · 宁静', freqs:[130.81,196.00,261.63,329.63] },
  { name:'A 小调 · 温柔', freqs:[110.00,164.81,220.00,261.63] },
  { name:'F 大调 · 平和', freqs:[174.61,220.00,261.63,349.23] },
  { name:'G 大调 · 希望', freqs:[196.00,246.94,293.66,392.00] },
];
const CHORD_DUR = 12;
// 五声音阶，用于清脆的琶音点缀
const pent = [261.63,293.66,329.63,392.00,440.00,523.25,587.33];

function note(freq, time, dur, type, vol){
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  osc.detune.value = (Math.random()*6 - 3); // 轻微失谐，更柔更自然
  const atk = Math.min(2, dur/3), rel = Math.min(3, dur/3);
  g.gain.setValueAtTime(0.0001, time);
  g.gain.linearRampToValueAtTime(vol, time + atk);
  g.gain.setValueAtTime(vol, time + dur - rel);
  g.gain.linearRampToValueAtTime(0.0001, time + dur);
  osc.connect(g); g.connect(filter);
  osc.start(time); osc.stop(time + dur + 0.1);
}

function scheduleChord(){
  const c = chords[chordIndex % chords.length];
  c.freqs.forEach((f,i)=>{
    note(f, nextChordTime, CHORD_DUR, 'sine', 0.10);
    note(f*2, nextChordTime, CHORD_DUR, 'triangle', 0.032); // 高八度微光
  });
  nowName.textContent = c.name;
  chordIndex++;
  nextChordTime += CHORD_DUR;
}

function scheduleArp(){
  const base = pent[Math.floor(Math.random()*pent.length)];
  const f = Math.random() < 0.22 ? base*2 : base;
  note(f, nextArpTime, 2.6, 'sine', 0.05);
  nextArpTime += 0.9 + Math.random()*1.5;
}

function createBreeze(){
  // 轻柔的「微风」底噪，营造自然气息
  const len = ctx.sampleRate * 2;
  const buf = ctx.createBuffer(1, len, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2 - 1;
  const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 420;
  const g = ctx.createGain(); g.gain.value = 0.016;
  const lfo = ctx.createOscillator(); lfo.frequency.value = 0.08;
  const lfoG = ctx.createGain(); lfoG.gain.value = 0.009;
  lfo.connect(lfoG); lfoG.connect(g.gain);
  src.connect(lp); lp.connect(g); g.connect(master);
  src.start(); lfo.start();
}

function targetGain(){ return 0.9 * userVolume; }

function init(){
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain(); master.gain.value = 0;
  filter = ctx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value = 1600;
  filter.connect(master); master.connect(ctx.destination);
  createBreeze();
  nextChordTime = ctx.currentTime + 0.6;
  nextArpTime = ctx.currentTime + 1.2;
  // 前瞻调度器：按 AudioContext 时间轴驱动，暂停/恢复不会错位
  setInterval(()=>{
    if(!playing || !ctx) return;
    while(nextChordTime < ctx.currentTime + CHORD_DUR) scheduleChord();
    while(nextArpTime < ctx.currentTime + 2.5) scheduleArp();
  }, 500);
}

function onStarted(){
  playing = true;
  eq.classList.add('on');
  nowHint.textContent = '播放中';
  iconPlay.style.display = 'none';
  iconPause.style.display = 'block';
  master.gain.cancelScheduledValues(ctx.currentTime);
  master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
  master.gain.linearRampToValueAtTime(targetGain(), ctx.currentTime + 2.2);
  overlay.classList.add('hide');
}

function setPausedUI(){
  playing = false;
  eq.classList.remove('on');
  nowHint.textContent = '已暂停';
  iconPlay.style.display = 'block';
  iconPause.style.display = 'none';
}

// 播放 / 暂停
playBtn.addEventListener('click', ()=>{
  if(!ctx) init();
  if(playing){ ctx.suspend(); setPausedUI(); }
  else { ctx.resume(); onStarted(); }
});

// 开场按钮（满足浏览器自动播放策略的一次交互）
$('#startBtn').addEventListener('click', ()=>{
  if(!ctx) init();
  ctx.resume();
  onStarted();
});

// 音量
volume.addEventListener('input', e=>{
  userVolume = e.target.value / 100;
  if(ctx && master){
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(targetGain(), ctx.currentTime + 0.15);
  }
});

// 页面加载：尝试自动播放，若被浏览器拦截则显示开场遮罩
window.addEventListener('load', ()=>{
  try{
    init();
    if(ctx.state === 'running'){ onStarted(); }
    else { setPausedUI(); }
  }catch(e){ /* 极旧浏览器不支持 Web Audio 时忽略 */ }
});
</script>
</body>
</html>
